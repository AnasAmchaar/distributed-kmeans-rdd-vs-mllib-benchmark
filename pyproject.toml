[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kmeans-benchmark"
version = "1.0.0"
description = "Distributed Document Clustering & K-Means Benchmark (RDD from scratch vs PySpark MLlib)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyspark>=3.4,<4.0",
    "mlflow>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pandas>=2.0"]

[project.scripts]
kmeans-benchmark = "kmeans_benchmark.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

